<!--print overrides for pandoc's html template, included via -H by scripts/generate_pdfs.py-->
<style>
html { background-color: white; font-size: 14pt; }
body { max-width: none; margin: 0; padding: 0; line-height: 1.45; color: #111; }
h1, h2, h3 { color: #065979; }
h1 { font-size: 2.7em; line-height: 1.1; margin: 0 0 0.25em; }
.hero { height: 66mm; overflow: hidden; border-radius: 3mm; margin: 0 0 5mm; }
.hero img { display: block; width: 100%; }
.kicker { font-size: 0.62em; letter-spacing: 0.18em; text-transform: uppercase; color: #00abeb; margin: 0 0 0.2em; }
.facts { margin: 0 0 0.9em; }
.fact, .ptag { display: inline-block; border-radius: 0.8em; padding: 0 0.7em; margin: 0 0.3em 0.3em 0; font-size: 0.68em; line-height: 1.7; }
.fact { background: #00abeb; color: #06283a; }
.ptag { background: #e3f4fb; color: #065979; }
h2 { font-size: 1.45em; margin: 1em 0 0.4em; }
h3 { font-size: 1.15em; margin: 0.8em 0 0.3em; }
.tips { background: #e3f4fb; border-radius: 6px; margin: 0.8em 0; padding: 0.1em 1em 0.3em; page-break-inside: avoid; }
.tips h2 { margin: 0.5em 0 0.3em; }
.tips blockquote { border-left: none; margin: 0; padding: 0; }
blockquote { color: #222; border-left: 3px solid #00abeb; margin: 0.6em 0 0.6em 0.4em; padding-left: 0.8em; }
img[align="right"] { clear: right; margin: 0 0 0.6em 1em; }
ul, ol { padding-left: 1.4em; }
li { margin: 0.15em 0; }
h2.toc-category { color: #065979; margin: 0.9em 0 0.2em; page-break-after: avoid; }
table.toc { display: table; width: 100%; border-collapse: collapse; margin: 0; }
table.toc tbody { border: none; }
table.toc tr { page-break-inside: avoid; }
table.toc td { padding: 0.2em 0; border: none; border-bottom: 1px dotted #c8c8c8; }
table.toc td.toc-page { text-align: right; width: 3em; }
a { color: #065979; }
</style>
