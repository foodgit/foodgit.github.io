name: Build Recipe Book PDF

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  book:
    # pinned: the wkhtmltopdf .deb below is built for this Ubuntu generation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # when called after a bot commit, build the new branch tip rather than
          # the commit that originally triggered the run
          ref: ${{ github.ref_name }}
      - name: Check the version has no release yet
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(tr -d '[:space:]' < version.txt)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            # published releases are never modified; bump version.txt to release again
            echo "::notice::Release $tag already exists; nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: ${{ !steps.check.outputs.exists }}
        with:
          python-version: '3.x'
      - name: Install PDF toolchain
        if: ${{ !steps.check.outputs.exists }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc ghostscript poppler-utils libimage-exiftool-perl \
            fontconfig xfonts-75dpi xfonts-base
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo apt-get install -y ./wkhtmltox_0.12.6.1-2.jammy_amd64.deb
      - name: Build PDFs
        if: ${{ !steps.check.outputs.exists }}
        # --all: file mtimes are meaningless after a fresh checkout
        run: python scripts/generate_pdfs.py --all
      - name: Publish release
        if: ${{ !steps.check.outputs.exists }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" gitFOOD_Recipe_Book.pdf \
            --title "v${TAG} - A4 Printable Version" \
            --notes "Built automatically from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d). Formatted and optimized for A4 page size printing. Booklet-printing friendly." \
            --target "$(git rev-parse HEAD)"
