# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch. Pushes that only touch what
  # rebuild-markdown.yml handles are skipped, because it deploys once it has
  # regenerated pages and built the book. Keep in sync with its paths list.
  push:
    branches: ["main"]
    paths-ignore:
      - recipes/**
      - pdf/**
      - images/**
      - assets/fonts/**
      - scripts/generate_pdfs.py
      - scripts/generate_markdown_recipes.py
      - scripts/update_readme.py
      - README.stub
      - index.stub
      - version.txt

  # Called at the end of the recipe pipeline
  workflow_call:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # when called after a bot commit, deploy the new branch tip
          ref: ${{ github.ref_name }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Allow only one concurrent deployment, skipping runs queued between the run
    # in-progress and latest queued. Job-level so it also applies when called.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
