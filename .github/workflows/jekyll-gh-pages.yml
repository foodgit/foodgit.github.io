#sample workflow for building and deploying a jekyll site to github pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  #skip pushes that only touch what rebuild-markdown.yml handles, it deploys after regenerating
  #keep in sync with the paths list in rebuild-markdown.yml
  push:
    branches: ["main"]
    paths-ignore:
      - recipes/**
      - pdf/**
      - images/**
      - assets/fonts/**
      - scripts/generate_pdfs.py
      - scripts/generate_markdown_recipes.py
      - scripts/units.py
      - scripts/update_readme.py
      - README.stub
      - index.stub
      - tags/groups.txt
      - version.txt

  #called at the end of the recipe pipeline
  workflow_call:

  #allows running this workflow manually from the actions tab
  workflow_dispatch:

#permissions for the github token to allow deployment to github pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  #build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          #deploy the new branch tip when called after a bot commit
          ref: ${{ github.ref_name }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  #deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    #allow one concurrent deployment, skipping runs queued between the running one and the latest
    #job-level so it also applies when called
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
