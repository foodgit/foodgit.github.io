name: Rebuild Markdown Files [bot]

# Recipe pipeline: regenerate recipe pages + README TOC, build the PDF book and
# publish it as a release, then deploy the site. Everything runs in one
# workflow because pushes made with GITHUB_TOKEN never trigger other workflows.

on:
  push:
    branches: [ "main" ]
    paths:
      - recipes/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: recipe-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # full history for the Created/Last Updated dates; branch tip so a
          # commit made earlier in the same run (new submission) is included
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Rebuild markdown recipes
        run: python scripts/generate_markdown_recipes.py
      - name: Recreate README.md TOC
        run: python scripts/update_readme.py
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "action@github.com"
          git add -A recipes template README.md tags
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Regenerated recipe pages and README TOC"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  book:
    needs: update
    uses: ./.github/workflows/build-book.yml

  deploy:
    needs: [update, book]
    # publish the site even if the PDF build fails
    if: ${{ !cancelled() && needs.update.result == 'success' }}
    uses: ./.github/workflows/jekyll-gh-pages.yml
