name: Rebuild Markdown Files [bot]

#recipe pipeline: regenerate pages and toc, build and release pdf, deploy site
#all in one workflow because pushes made with the github token never trigger other workflows
#the book is only released when its recipe pages changed, see build-book.yml
#website-only changes build nothing, releases are never overwritten

on:
  push:
    branches: [ "main" ]
    #keep in sync with the paths-ignore list in jekyll-gh-pages.yml
    paths:
      - recipes/**
      - pdf/**
      - images/**
      - assets/fonts/**
      - scripts/generate_pdfs.py
      - scripts/generate_markdown_recipes.py
      - scripts/units.py
      - scripts/update_readme.py
      - README.stub
      - index.stub
      - tags/groups.txt
      - version.txt
  workflow_call:
    inputs:
      bump:
        description: patch, minor, none, or auto (release only if the book pages changed)
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, none]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: recipe-update
      cancel-in-progress: false
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          #full history for the created/last updated dates and change detection
          #branch tip, so a commit made earlier in the same run is included
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Rebuild markdown recipes
        run: python scripts/generate_markdown_recipes.py
      - name: Recreate README.md TOC
        run: python scripts/update_readme.py
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "action@github.com"
          git add -A recipes template README.md index.md tags _data version.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Regenerated recipe pages and README TOC"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  book:
    needs: update
    uses: ./.github/workflows/build-book.yml
    with:
      bump: ${{ inputs.bump || 'auto' }}

  deploy:
    needs: [update, book]
    #publish the site even when no book was built or the pdf build failed
    if: ${{ !cancelled() && needs.update.result == 'success' }}
    uses: ./.github/workflows/jekyll-gh-pages.yml
