name: Rebuild Markdown Files [bot]

#recipe pipeline: regenerate pages and toc, bump version, build and release pdf, deploy site
#all in one workflow because pushes made with the github token never trigger other workflows
#an unreleased version.txt is released as it is (set by hand, or an earlier release failed)
#otherwise recipe changes bump the patch and book style or structure changes bump the minor
#website-only changes do not bump, "[no release]" in a commit message skips a bump
#a release is only published when the current version has none, so releases are never overwritten

on:
  push:
    branches: [ "main" ]
    #keep in sync with the paths-ignore list in jekyll-gh-pages.yml
    paths:
      - recipes/**
      - pdf/**
      - images/**
      - assets/fonts/**
      - scripts/generate_pdfs.py
      - scripts/generate_markdown_recipes.py
      - scripts/update_readme.py
      - README.stub
      - index.stub
      - tags/groups.txt
      - version.txt
  workflow_call:
    inputs:
      bump:
        description: patch, minor, none, or auto (work it out from the pushed changes)
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, none]
        default: none

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: recipe-update
      cancel-in-progress: false
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          #full history for the created/last updated dates and change detection
          #branch tip, so a commit made earlier in the same run is included
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Rebuild markdown recipes
        run: python scripts/generate_markdown_recipes.py
      - name: Recreate README.md TOC
        run: python scripts/update_readme.py
      - name: Bump version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          BEFORE: ${{ github.event.before }}
        run: |
          bump="$BUMP"
          current="$(tr -d '[:space:]' < version.txt)"
          if [ "$bump" = "auto" ]; then
            if ! gh release view "$current" > /dev/null 2>&1; then
              #not released yet (set by hand, or an earlier release build failed), release it as it is
              bump=none
            elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                range="$BEFORE..$GITHUB_SHA"
              else
                range="$GITHUB_SHA~1..$GITHUB_SHA"
              fi
              changed="$(git diff --name-only "${range%%..*}" "${range##*..}")"
              if git log --format=%B "$range" | grep -qF '[no release]'; then
                bump=none    #e.g. a generator change that only affects the website
              elif grep -qE '^(pdf/|images/|assets/fonts/|scripts/generate_(pdfs|markdown_recipes)\.py$)' <<< "$changed"; then
                bump=minor   #book style or structure
              elif grep -q '^recipes/' <<< "$changed"; then
                bump=patch   #recipe content
              else
                bump=none
              fi
            else
              bump=patch     #approved submission: a new recipe
            fi
          fi
          #here-string, not <(...): version.txt has no trailing newline
          #read returns non-zero at eof, which fails the step under bash -e
          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          printf '%s' "$version" > version.txt
          echo "bump: $bump, version: $version"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit and push changes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "action@github.com"
          git add -A recipes template README.md index.md tags _data version.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          if git diff --cached --quiet -- version.txt; then
            git commit -m "Regenerated recipe pages and README TOC"
          else
            git commit -m "Release $VERSION"
          fi
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  book:
    needs: update
    if: ${{ needs.update.outputs.release == 'true' }}
    uses: ./.github/workflows/build-book.yml

  deploy:
    needs: [update, book]
    #publish the site even when no book was built or the pdf build failed
    if: ${{ !cancelled() && needs.update.result == 'success' }}
    uses: ./.github/workflows/jekyll-gh-pages.yml
